[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thzim"
version = "0.1.0"
description = "THz FEL ideal machine: middle-optics design toolchain and result-reproduction workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "scienceplots",
    "ocelot-collab>=25.07",
]

# Companion repository (install separately, see README): partdist

[tool.setuptools.packages.find]
where = ["src"]
